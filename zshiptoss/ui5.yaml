specVersion: "4.0"
metadata:
  name: zshiptoss
type: application
builder:
  resources:
    excludes:
      - /localService/**
      - /test/**
  componentPreload:
    paths:
      - "porky/ssup/zshiptoss/**"
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            destination: DE2
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon