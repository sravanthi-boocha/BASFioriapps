# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zselectorv2
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DE2
          url: http://pkynj-de2app.porkyproducts.loc:8000
          client: '100'
        app:
          name: ZSELECTORV2
          description: Selector Manage List
          package: Z001
          transport: DE2K906112
        exclude:
          - /test/
